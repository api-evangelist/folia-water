name: Folia Water
description: >-
  Folia Water, Inc. is a clean-water social enterprise founded in 2016 by Jonathan Levine, Theresa
  Dankovich, and Cantwell Carson with the goal of bringing safe drinking water to 100 million people
  for pennies a day. The company manufactures Folia Filters, an affordable antimicrobial filter paper
  embedded with silver nanoparticles that kills 99.9999% of bacteria and 99.7% of viruses while
  removing protozoa and iron. Folia Water sells through distribution partners in emerging markets such
  as Bangladesh and is backed by 500 Global. It is a physical consumer-products manufacturer with no
  public developer platform, API, or SDK surface as of this profile.
